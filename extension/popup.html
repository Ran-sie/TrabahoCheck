<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TrabahoCheck</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        padding: 16px;
        font-family: system-ui, sans-serif;
        color: #17181a;
        background: #f7f6f2;
      }
      h1 { margin: 0 0 4px; font-size: 16px; }
      p { margin: 0 0 12px; font-size: 13px; line-height: 1.4; color: #44484f; }
      button {
        width: 100%;
        height: 44px;
        border: 0;
        border-radius: 10px;
        background: #1f4fa8;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover { background: #163b80; }
      #status { margin-top: 8px; font-size: 12px; color: #a8231a; }
    </style>
  </head>
  <body>
    <h1>TrabahoCheck</h1>
    <p>Open a job post, then press the button. Select the job text first if the page is messy.</p>
    <button id="go" type="button">Check this job</button>
    <div id="status" role="alert"></div>
    <script src="popup.js"></script>
  </body>
</html>
